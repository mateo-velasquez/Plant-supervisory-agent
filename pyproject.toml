[project]
name = "plant-supervisory-agent"
version = "0.1.0"
description = "Agent-based plant monitor: detects deviations from plan, tracks cases and decides what to notify and when."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-name = "plant_monitor"

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["**/*.md"]  # code blocks in docs are illustrative, not production code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["plant_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["plant_monitor"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
