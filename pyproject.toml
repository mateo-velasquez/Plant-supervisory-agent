[project]
name = "plant-supervisory-agent"
version = "0.1.0"
description = "Monitor de planta con agentes: detecta desvíos contra el plan, sigue casos y decide qué avisar y cuándo."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-name = "plant_monitor"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
